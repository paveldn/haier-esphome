# AS25S2SN1FA-NRC. Kept fields are ones the module e++ parser decodes.
packages:
  hon_climate: !include ../climate/haier_hon.yaml
  turn_on_service: !include ../api/service.turn_on.yaml
  turn_off_service: !include ../api/service.turn_off.yaml
  self_cleaning_button: !include ../button/self_cleaning.yaml
  cleaning_status_text_sensor: !include ../text_sensor/cleaning_status.yaml
  display_switch: !include ../switch/display.yaml
  beeper_switch: !include ../switch/beeper.yaml
